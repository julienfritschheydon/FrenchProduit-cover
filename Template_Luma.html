<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style type="text/css">
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .main-container {
      background-color: #132A66;
      width: 1200px;
      height: 1200px;
      position: relative;
      box-sizing: border-box;
      padding: 60px 70px;
      font-family: Poppins;
      color: #ffffff;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .logo-container svg {
      width: 240px;
      height: auto;
    }

    .sponsor-box {
      text-align: center;
    }

    .sponsor-box .sponsor-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .sponsor-box .sponsor-name {
      background: #ffffff;
      color: #132A66;
      font-weight: 700;
      font-size: 20px;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-block;
    }

    .sponsor-box .sponsor-logo {
      background: #ffffff;
      border-radius: 8px;
      padding: 10px 18px;
      display: inline-block;
    }

    .sponsor-box .sponsor-logo img {
      display: block;
      max-width: 160px;
      max-height: 60px;
      object-fit: contain;
    }

    .tags-row {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }

    .tag {
      font-family: Poppins;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .tag.tag-fill {
      background: #E4573D;
      color: #ffffff;
    }

    .tag.tag-outline {
      background: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
    }

    .title-wrap {
      margin-top: 60px;
      text-align: center;
    }

    .title-wrap p {
      margin: 0 auto;
      max-width: 950px;
      font-family: Poppins;
      font-weight: 800;
      font-size: 56px;
      line-height: 66px;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .title-wrap p.long-title {
      font-size: 44px;
      line-height: 54px;
    }

    .title-wrap p.very-long-title {
      font-size: 34px;
      line-height: 44px;
    }

    .separator-event {
      width: 90px;
      height: 6px;
      background: #E4573D;
      margin: 40px auto 0;
    }

    .subtitle-wrap {
      text-align: center;
      margin-top: 24px;
      font-family: Poppins;
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
      color: #cfd6ea;
    }

    .speakers-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 60px;
      margin-top: 70px;
    }

    .speaker-card {
      position: relative;
      width: 260px;
      flex: 0 0 auto;
    }

    .speaker-photo {
      width: 260px;
      height: 320px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .speaker-tags {
      position: absolute;
      bottom: -22px;
      left: 10px;
      max-width: 90%;
    }

    .speaker-tags .tag-name {
      background: #E4573D;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 4px;
      transform: rotate(-3deg);
      box-shadow: -3px 3px 0px 0px rgba(255, 255, 255, 0.3);
      white-space: nowrap;
      display: inline-block;
    }

    .speaker-tags .tag-title {
      background: #f3b8ab;
      color: #132A66;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 4px;
      transform: rotate(-1deg);
      margin-top: 6px;
      margin-left: 6px;
      white-space: nowrap;
      display: inline-block;
    }

    /* Ajustement de la taille des cartes selon le nombre de speakers, pour éviter tout chevauchement */
    .speakers-row.count-2 {
      gap: 45px;
      margin-top: 90px;
    }

    .speakers-row.count-2 .speaker-card {
      width: 220px;
    }

    .speakers-row.count-2 .speaker-photo {
      width: 220px;
      height: 270px;
    }

    .speakers-row.count-3 {
      gap: 36px;
      margin-top: 100px;
    }

    .speakers-row.count-3 .speaker-card {
      width: 190px;
    }

    .speakers-row.count-3 .speaker-photo {
      width: 190px;
      height: 230px;
    }

    .speakers-row.count-3 .speaker-tags .tag-name {
      font-size: 15px;
      padding: 6px 10px;
    }

    .speakers-row.count-3 .speaker-tags .tag-title {
      font-size: 12px;
      padding: 5px 9px;
    }

    .speakers-row.count-4 {
      gap: 26px;
      margin-top: 110px;
    }

    .speakers-row.count-4 .speaker-card {
      width: 160px;
    }

    .speakers-row.count-4 .speaker-photo {
      width: 160px;
      height: 195px;
    }

    .speakers-row.count-4 .speaker-tags .tag-name {
      font-size: 13px;
      padding: 5px 9px;
    }

    .speakers-row.count-4 .speaker-tags .tag-title {
      font-size: 11px;
      padding: 4px 8px;
    }

    .footer-row {
      position: absolute;
      bottom: 60px;
      left: 70px;
      right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: Poppins;
    }

    .footer-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 600;
    }

    .footer-line .accent {
      color: #E4573D;
    }

    .footer-divider {
      width: 2px;
      height: 60px;
      background: rgba(255, 255, 255, 0.4);
    }

    .footer-col.location {
      text-align: right;
      align-items: flex-end;
    }

    .footer-line.host-name {
      font-weight: 700;
    }

    .footer-line.address {
      font-size: 18px;
      font-weight: 400;
      color: #cfd6ea;
    }
  </style>
</head>

<body>

      </div>
      <? if (data.sponsorLogo || data.sponsorName) { ?>
      <div class="sponsor-box">
        <div class="sponsor-label">SPONSOR</div>
        <? if (data.sponsorLogo) { ?>
        <div class="sponsor-logo">
          <img src="<?!= data.sponsorLogo ?>" alt="<?= data.sponsorName ?>">
        </div>
        <? } else { ?>
        <div class="sponsor-name">
          <?= data.sponsorName ?>
        </div>
        <? } ?>
      </div>
      <? } ?>
    </div>

    <div class="tags-row">
      <div class="tag tag-fill">#
        <?= data.chapter ?>
      </div>
      <div class="tag tag-outline">#
        <?= data.eventType ?>
      </div>
    </div>

    <?
      var titleLength = data.title.length;
      var titleClass = '';
      if (titleLength > 70) {
        titleClass = 'very-long-title';
      } else if (titleLength > 50) {
        titleClass = 'long-title';
      }
    ?>
    <div class="title-wrap">
      <p class="<?= titleClass ?>">
        <?= data.title ?>
      </p>
      <div class="separator-event"></div>
      <? if (data.subtitle) { ?>
      <div class="subtitle-wrap">
        <?!= data.subtitle ?>
      </div>
      <? } ?>
    </div>

    <?
      var speakerCountLuma = Math.min(data.speakers.length, 4);
    ?>
    <div class="speakers-row count-<?= speakerCountLuma ?>">
      <? for (var i = 0; i < data.speakers.length && i < 4; i++) {
           var speaker = data.speakers[i];
      ?>
      <div class="speaker-card">
        <img src="<?!= speaker.photo ?>" alt="<?= speaker.name ?>" class="speaker-photo"
          onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Photo';">
        <div class="speaker-tags">
          <div class="tag-name">
            <?= speaker.name ?>
          </div>
          <? if (speaker.title) { ?>
          <div class="tag-title">
            <?= speaker.title ?>
          </div>
          <? } ?>
        </div>
      </div>
      <? } ?>
    </div>

    <div class="footer-row">
      <div class="footer-col">
        <div class="footer-line">
          <span>
            <?= data.date ?>
          </span>
        </div>
        <div class="footer-line">
          <span class="accent">
            <?= data.time ?>
          </span>
        </div>
      </div>
      <div class="footer-divider"></div>
      <div class="footer-col location">
        <div class="footer-line host-name">
          <?= data.hostName ?>
        </div>
        <div class="footer-line address">
          <?= data.address ?>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
